name = "autro-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare D1 (SQLite database) ──────────────────────────────────────────
# In local dev: wrangler simulates D1 in .wrangler/state/v3/d1/
# In production: create with `wrangler d1 create autro-db`
[[d1_databases]]
binding = "DB"
database_name = "autro-db"
database_id = "82dfb216-515c-4591-9f03-f496c3694935"
migrations_dir = "drizzle"

# ── Cloudflare R2 (Object storage) ───────────────────────────────────────────
# In local dev: wrangler simulates R2 in .wrangler/state/v3/r2/
# In production: create with `wrangler r2 bucket create autro-uploads`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "autro-uploads"

# ── Environment variables (secrets) ──────────────────────────────────────────
# DO NOT put real values here.
# For local dev: create apps/api/.dev.vars (gitignored)
# For production: `wrangler secret put VARIABLE_NAME`
#
# Required vars:
#   GOOGLE_CLIENT_ID        ┐
#   GOOGLE_CLIENT_SECRET    │ core — validateEnv() checks these on every
#   GOOGLE_REDIRECT_URI     │ request (except /health); missing → 500
#   JWT_SECRET              ┘
#   R2_ACCOUNT_ID           ┐
#   R2_ACCESS_KEY_ID        │ upload only — validateR2Env() checks these in
#   R2_SECRET_ACCESS_KEY    │ POST /upload/presign, so the rest of the API
#   R2_BUCKET_NAME          │ still serves without them
#   R2_PUBLIC_URL           ┘
#
# No fallback defaults anywhere by design (CLAUDE.md rule 4).
# See .dev.vars.example for what each one is and where to get it.
