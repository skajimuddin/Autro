name = "workshop-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare D1 (SQLite database) ──────────────────────────────────────────
# In local dev: wrangler simulates D1 in .wrangler/state/v3/d1/
# In production: create with `wrangler d1 create workshop-db`
[[d1_databases]]
binding = "DB"
database_name = "workshop-db"
database_id = "placeholder-replace-in-production"
migrations_dir = "drizzle"

# ── Cloudflare R2 (Object storage) ───────────────────────────────────────────
# In local dev: wrangler simulates R2 in .wrangler/state/v3/r2/
# In production: create with `wrangler r2 bucket create workshop-uploads`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "workshop-uploads"

# ── Environment variables (secrets) ──────────────────────────────────────────
# DO NOT put real values here.
# For local dev: create apps/api/.dev.vars (gitignored)
# For production: `wrangler secret put VARIABLE_NAME`
#
# Required vars:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REDIRECT_URI
#   JWT_SECRET
