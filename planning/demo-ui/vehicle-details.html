<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#2563eb',
              'primary-hover': '#1d4ed8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              'bg-color': '#f1f5f9',
              'card-bg': '#ffffff',
              'text-primary': '#0f172a',
              'text-secondary': '#64748b',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-200 flex justify-center min-h-screen font-sans">
    <div class="w-full max-w-[414px] h-screen overflow-y-auto flex flex-col relative shadow-[0_0_20px_rgba(0,0,0,0.1)] bg-bg-color">
        <header class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
            <div class="text-[1.2rem] font-semibold flex items-center gap-4">
                <a href="index.html" class="text-text-primary no-underline"><i class="fa-solid fa-arrow-left"></i></a>
                <span>OD 02 AB 1234</span>
            </div>
        </header>

        <main class="p-5 flex-1 flex flex-col gap-4 pb-[100px]">
            <div class="flex gap-2.5 overflow-x-auto pb-2.5">
                <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=150&q=80" class="rounded-xl w-[100px] h-20 object-cover">
                <img src="https://images.unsplash.com/photo-1625047509248-ec889cbabe0b?auto=format&fit=crop&w=150&q=80" class="rounded-xl w-[100px] h-20 object-cover">
                <div class="rounded-xl w-[100px] h-20 bg-slate-200 flex justify-center items-center text-text-secondary"><i class="fa-solid fa-plus"></i></div>
            </div>

            <div class="bg-white rounded-2xl p-5 shadow-[0_2px_5px_rgba(0,0,0,0.02)]">
                <div class="flex justify-between mb-3 text-[1.05rem]"><span class="text-text-secondary">Customer</span><span class="font-semibold">Azim</span></div>
                <div class="flex justify-between mb-3 text-[1.05rem]"><span class="text-text-secondary">Phone</span><span class="font-semibold">9876543210</span></div>
                <div class="flex justify-between mb-3 text-[1.05rem]"><span class="text-text-secondary">Vehicle</span><span class="font-semibold">Honda City</span></div>
            </div>

            <div class="text-[0.95rem] text-text-secondary uppercase tracking-[1px] mt-2.5 font-bold">Complaint</div>
            <div class="bg-white rounded-2xl p-4 shadow-[0_2px_5px_rgba(0,0,0,0.02)] font-medium">
                <i class="fa-solid fa-triangle-exclamation text-warning mr-2"></i> Engine Noise
            </div>

            <div class="grid grid-cols-2 gap-4 mt-2">
                <div class="bg-white rounded-2xl p-4 text-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <div class="text-[0.9rem] text-text-secondary">Estimate</div>
                    <div class="text-[1.4rem] font-bold text-text-primary">₹0</div>
                </div>
                <div class="bg-white rounded-2xl p-4 text-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <div class="text-[0.9rem] text-text-secondary">Final Bill</div>
                    <div class="text-[1.4rem] font-bold text-primary">₹0</div>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-2.5">
                <a href="estimate.html" class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer no-underline transition-transform duration-100 active:scale-[0.98] bg-transparent border-2 border-solid border-primary text-primary">Create Estimate</a>
                <a href="work-done.html" class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer no-underline transition-transform duration-100 active:scale-[0.98] bg-transparent border-2 border-solid border-primary text-primary">Add Work Done</a>
                <a href="invoice.html" class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-primary text-white shadow-[0_10px_15px_-3px_rgba(37,99,235,0.3)]">Generate Invoice</a>
            </div>
        </main>
    </div>
</body>
</html>
