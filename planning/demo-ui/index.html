<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#2563eb',
              'primary-hover': '#1d4ed8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              'bg-color': '#f1f5f9',
              'card-bg': '#ffffff',
              'text-primary': '#0f172a',
              'text-secondary': '#64748b',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-200 flex justify-center min-h-screen font-sans m-0 p-0 box-border text-text-primary">
    <div class="w-full max-w-[414px] h-screen overflow-y-auto flex flex-col relative shadow-[0_0_20px_rgba(0,0,0,0.1)] bg-slate-100">
        <header class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
            <div class="text-[1.2rem] font-semibold flex items-center gap-4 text-text-primary">
                <i class="fa-solid fa-bars"></i>
                <span>Garage</span>
            </div>
            <a href="staff-profile.html" class="text-[1.4rem] text-text-secondary no-underline"><i class="fa-solid fa-user-circle"></i></a>
        </header>

        <main class="p-5 flex-1 flex flex-col gap-4 pb-[100px]">
            <div class="text-2xl font-bold mb-2.5">👋 Good Morning</div>

            <div class="bg-white rounded-2xl py-6 px-5 flex justify-between items-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
                <div class="text-[1.1rem] font-semibold text-text-primary"><i class="fa-solid fa-car-side mr-2 text-primary"></i> Vehicles Today</div>
                <div class="text-[2rem] font-bold text-primary">12</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-5 text-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] text-warning">
                    <i class="fa-solid fa-hourglass-half text-2xl mb-2"></i>
                    <div class="text-2xl font-bold">4</div>
                    <div class="text-[0.9rem] text-text-secondary">Active</div>
                </div>
                <div class="bg-white rounded-2xl p-5 text-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] text-success">
                    <i class="fa-solid fa-circle-check text-2xl mb-2"></i>
                    <div class="text-2xl font-bold">8</div>
                    <div class="text-[0.9rem] text-text-secondary">Done</div>
                </div>
            </div>

            <div class="text-[0.95rem] text-text-secondary uppercase tracking-[1px] mt-2.5 font-bold">Quick Actions</div>

            <a href="add-vehicle.html" class="flex items-center gap-3 w-full p-[18px] pl-6 rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-white text-text-primary shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] justify-start">
                <i class="fa-solid fa-plus-circle text-primary text-[1.4rem] w-[30px] text-center"></i> New Vehicle
            </a>
            
            <a href="estimate.html" class="flex items-center gap-3 w-full p-[18px] pl-6 rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-white text-text-primary shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] justify-start">
                <i class="fa-solid fa-file-invoice-dollar text-primary text-[1.4rem] w-[30px] text-center"></i> New Estimate
            </a>
            
            <a href="invoice.html" class="flex items-center gap-3 w-full p-[18px] pl-6 rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-white text-text-primary shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] justify-start">
                <i class="fa-solid fa-receipt text-primary text-[1.4rem] w-[30px] text-center"></i> Generate Invoice
            </a>
            
            <a href="staff.html" class="flex items-center gap-3 w-full p-[18px] pl-6 rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-white text-text-primary shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] justify-start">
                <i class="fa-solid fa-users-gear text-primary text-[1.4rem] w-[30px] text-center"></i> Staff
            </a>
        </main>

        <nav class="flex justify-around pt-3 px-4 pb-6 bg-white border-t border-slate-200 fixed bottom-0 w-full max-w-[414px] z-10">
            <a href="index.html" class="text-primary text-[1.4rem] no-underline flex flex-col items-center gap-1.5"><i class="fa-solid fa-house"></i><span class="text-xs font-semibold">Home</span></a>
            <a href="vehicle-details.html" class="text-text-secondary text-[1.4rem] no-underline flex flex-col items-center gap-1.5"><i class="fa-solid fa-car"></i><span class="text-xs font-semibold">Vehicles</span></a>
            <a href="staff.html" class="text-text-secondary text-[1.4rem] no-underline flex flex-col items-center gap-1.5"><i class="fa-solid fa-users"></i><span class="text-xs font-semibold">Staff</span></a>
            <a href="#" class="text-text-secondary text-[1.4rem] no-underline flex flex-col items-center gap-1.5"><i class="fa-solid fa-gear"></i><span class="text-xs font-semibold">Settings</span></a>
        </nav>
    </div>
</body>
</html>
