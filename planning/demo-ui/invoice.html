<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#2563eb',
              'primary-hover': '#1d4ed8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              'bg-color': '#f1f5f9',
              'card-bg': '#ffffff',
              'text-primary': '#0f172a',
              'text-secondary': '#64748b',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-200 flex justify-center min-h-screen font-sans text-text-primary">
    <div class="w-full max-w-[414px] h-screen overflow-y-auto flex flex-col relative shadow-[0_0_20px_rgba(0,0,0,0.1)] bg-slate-100">
        <header class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
            <div class="text-[1.2rem] font-semibold flex items-center gap-4">
                <a href="vehicle-details.html" class="text-text-primary no-underline"><i class="fa-solid fa-arrow-left"></i></a>
                <span>Invoice</span>
            </div>
        </header>

        <main class="p-5 flex-1 flex flex-col gap-4 pb-[100px]">
            <div class="bg-white rounded-2xl p-5 shadow-[0_2px_5px_rgba(0,0,0,0.02)] flex justify-between border-l-4 border-primary">
                <div>
                    <div class="text-[0.85rem] text-text-secondary mb-1">Customer</div>
                    <div class="font-bold text-[1.1rem]">Azim</div>
                </div>
                <div class="text-right">
                    <div class="text-[0.85rem] text-text-secondary mb-1">Vehicle</div>
                    <div class="font-bold text-[1.1rem] text-primary">OD 02 AB 1234</div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-5 shadow-[0_2px_5px_rgba(0,0,0,0.02)] mt-2.5">
                <div class="flex justify-between mb-3 text-[1.05rem]">
                    <span class="text-text-secondary">Oil Change</span>
                    <span class="font-semibold">₹500</span>
                </div>
                <div class="flex justify-between mb-3 text-[1.05rem]">
                    <span class="text-text-secondary">Brake Pads</span>
                    <span class="font-semibold">₹2400</span>
                </div>
                <div class="flex justify-between mb-0 text-[1.05rem]">
                    <span class="text-text-secondary">AC Cleaning</span>
                    <span class="font-semibold">₹800</span>
                </div>
                
                <div class="h-px bg-slate-300 my-5"></div>
                
                <div class="flex justify-between items-center">
                    <div class="text-[1.2rem] font-bold">TOTAL</div>
                    <div class="text-[2rem] font-bold text-primary">₹3700</div>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-5">
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-2 border-primary bg-transparent text-primary transition-transform duration-100 active:scale-[0.98]"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                    <button class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-2 border-primary bg-transparent text-primary transition-transform duration-100 active:scale-[0.98]"><i class="fa-solid fa-print"></i> Print</button>
                </div>
                <button class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none text-white bg-success shadow-[0_10px_15px_-3px_rgba(16,185,129,0.3)] transition-transform duration-100 active:scale-[0.98]"><i class="fa-solid fa-check"></i> Mark as Paid</button>
            </div>
        </main>
    </div>
</body>
</html>
