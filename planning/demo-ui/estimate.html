<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#2563eb',
              'primary-hover': '#1d4ed8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              'bg-color': '#f1f5f9',
              'card-bg': '#ffffff',
              'text-primary': '#0f172a',
              'text-secondary': '#64748b',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-200 flex justify-center min-h-screen font-sans">
    <div class="w-full max-w-[414px] bg-bg-color h-screen overflow-y-auto flex flex-col shadow-[0_0_20px_rgba(0,0,0,0.1)] relative">
        <header class="flex justify-between items-center p-[20px] bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
            <div class="text-[1.2rem] font-semibold flex items-center gap-[16px]">
                <a href="vehicle-details.html" class="text-text-primary no-underline"><i class="fa-solid fa-arrow-left"></i></a>
                <span>Estimate</span>
            </div>
        </header>

        <main class="p-[20px] flex-1 flex flex-col gap-[16px] pb-[100px]">
            <div class="bg-white rounded-2xl p-[16px] shadow-[0_2px_5px_rgba(0,0,0,0.02)] flex justify-between">
                <div>
                    <div class="text-[0.85rem] text-text-secondary">Customer</div>
                    <div class="font-bold">Azim</div>
                </div>
                <div class="text-right">
                    <div class="text-[0.85rem] text-text-secondary">Vehicle</div>
                    <div class="font-bold text-primary">OD 02 AB 1234</div>
                </div>
            </div>

            <div class="text-[0.95rem] text-text-secondary uppercase tracking-[1px] mt-[10px] font-bold">Work</div>
            
            <div class="bg-white rounded-2xl p-[16px] flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] text-text-primary mb-[4px] no-underline">
                <div class="flex flex-col gap-[6px]">
                    <div class="font-bold text-[1.1rem] flex items-center gap-[8px]">Oil Change</div>
                </div>
                <div class="font-bold text-text-primary text-[1.1rem]">₹500</div>
            </div>
            
            <div class="bg-white rounded-2xl p-[16px] flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] text-text-primary mb-[4px] no-underline">
                <div class="flex flex-col gap-[6px]">
                    <div class="font-bold text-[1.1rem] flex items-center gap-[8px]">Brake Pads</div>
                </div>
                <div class="font-bold text-text-primary text-[1.1rem]">₹2400</div>
            </div>

            <button class="flex items-center justify-center gap-[12px] w-full p-[12px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer transition-transform duration-100 active:scale-[0.98] bg-transparent border-2 border-dashed border-primary text-primary">+ Add Item</button>

            <div class="h-[1px] bg-[#cbd5e1] mt-[20px] mb-[16px]"></div>

            <div class="flex justify-between items-center py-[10px]">
                <div class="text-[1.2rem] font-bold">Total</div>
                <div class="text-[1.8rem] font-bold text-primary">₹2900</div>
            </div>

            <div class="flex flex-col gap-[12px] mt-[20px]">
                <button class="flex items-center justify-center gap-[12px] w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer transition-transform duration-100 active:scale-[0.98] bg-transparent border-2 border-solid border-primary text-primary">Save</button>
                <a href="invoice.html" class="flex items-center justify-center gap-[12px] w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer no-underline transition-transform duration-100 active:scale-[0.98] bg-primary text-white shadow-[0_10px_15px_-3px_rgba(37,99,235,0.3)]">Convert to Invoice</a>
            </div>
        </main>
    </div>
</body>
</html>
