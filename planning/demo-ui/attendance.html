<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb',
                        'primary-hover': '#1d4ed8',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        'bg-color': '#f1f5f9',
                        'card-bg': '#ffffff',
                        'text-primary': '#0f172a',
                        'text-secondary': '#64748b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-200 flex justify-center min-h-screen font-sans text-text-primary">
    <div class="w-full max-w-[414px] bg-bg-color h-screen overflow-y-auto flex flex-col shadow-[0_0_20px_rgba(0,0,0,0.1)] relative">
        <header class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
            <div class="text-[1.2rem] font-semibold flex items-center gap-4">
                <a href="staff.html" class="text-text-primary no-underline"><i class="fa-solid fa-arrow-left"></i></a>
                <span>Staff Attendance</span>
            </div>
            <div class="text-[1.4rem] text-text-secondary no-underline"><i class="fa-solid fa-camera"></i></div>
        </header>

        <main class="p-5 flex-1 flex flex-col gap-4 pb-[100px]">
            <div class="bg-white p-[30px] rounded-[20px] text-center mb-[10px] shadow-[0_4px_6px_rgba(0,0,0,0.05)]">
                <h3 class="mb-4 text-[1.17em] font-bold">Dynamic QR</h3>
                <div class="w-[220px] h-[220px] bg-[url('https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=GarageAppAttendance')] bg-center bg-cover mx-auto mb-5"></div>
                <div class="text-text-secondary mb-2 font-semibold">Expires in</div>
                <div class="text-[2rem] font-bold text-danger font-mono">00:28</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-5 text-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <div class="text-[0.95rem] text-text-secondary font-semibold">Present Today</div>
                    <div class="text-[2rem] font-bold text-success mt-2">12</div>
                </div>
                <div class="bg-white rounded-2xl p-5 text-center shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <div class="text-[0.95rem] text-text-secondary font-semibold">Absent</div>
                    <div class="text-[2rem] font-bold text-danger mt-2">2</div>
                </div>
            </div>

            <button class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-2 border-primary bg-transparent text-primary no-underline transition-transform duration-100 active:scale-[0.98] mt-6">
                <i class="fa-solid fa-rotate-right"></i> Refresh QR
            </button>
        </main>
    </div>
</body>
</html>
