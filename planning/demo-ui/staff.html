<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#2563eb',
              'primary-hover': '#1d4ed8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              'bg-color': '#f1f5f9',
              'card-bg': '#ffffff',
              'text-primary': '#0f172a',
              'text-secondary': '#64748b',
            }
          }
        }
      }

<body class="bg-slate-200 flex justify-center min-h-screen font-sans">
    <div class="w-full max-w-[414px] h-screen overflow-y-auto flex flex-col relative shadow-[0_0_20px_rgba(0,0,0,0.1)] bg-bg-color">
        <header class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">

            <a href="staff-profile.html" class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] no-underline text-text-primary mb-1">

                    <div class="font-bold text-[1.1rem] flex items-center gap-2"><i class="fa-solid fa-circle-user text-text-secondary"></i> Rahul</div>
                    <div class="text-text-secondary text-[0.9rem]">Mechanic</div>
                </div>
                <div class="px-2 py-1 rounded-lg text-[0.75rem] font-bold uppercase bg-emerald-100 text-emerald-600">● Present</div>
            </a>
            
            <a href="staff-profile.html" class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] no-underline text-text-primary mb-1">

                    <div class="font-bold text-[1.1rem] flex items-center gap-2"><i class="fa-solid fa-circle-user text-text-secondary"></i> Suman</div>
                    <div class="text-text-secondary text-[0.9rem]">Reception</div>
                </div>
                <div class="px-2 py-1 rounded-lg text-[0.75rem] font-bold uppercase bg-emerald-100 text-emerald-600">● Present</div>
            </a>
            
            <a href="staff-profile.html" class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] no-underline text-text-primary mb-1">

                    <div class="font-bold text-[1.1rem] flex items-center gap-2"><i class="fa-solid fa-circle-user text-text-secondary"></i> Rakesh</div>
                    <div class="text-text-secondary text-[0.9rem]">Mechanic</div>
                </div>
                <div class="px-2 py-1 rounded-lg text-[0.75rem] font-bold uppercase bg-red-100 text-red-600">○ Absent</div>
            </a>

            <button class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-primary text-white shadow-[0_10px_15px_-3px_rgba(37,99,235,0.3)] mt-5">＋ Add Staff</button>

</html>
