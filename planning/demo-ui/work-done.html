<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Done</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#2563eb',
              'primary-hover': '#1d4ed8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              'bg-color': '#f1f5f9',
              'card-bg': '#ffffff',
              'text-primary': '#0f172a',
              'text-secondary': '#64748b',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-200 flex justify-center min-h-screen font-sans">
    <div class="w-full max-w-[414px] h-screen overflow-y-auto flex flex-col relative shadow-[0_0_20px_rgba(0,0,0,0.1)] bg-slate-100">
        <header class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
            <div class="text-[1.2rem] font-semibold flex items-center gap-4">
                <a href="vehicle-details.html" class="text-text-primary no-underline"><i class="fa-solid fa-arrow-left"></i></a>
                <span>Work Done</span>
            </div>
        </header>

        <main class="p-5 flex-1 flex flex-col gap-4 pb-[100px]">
            <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] no-underline text-text-primary mb-1">
                <div class="flex flex-col gap-[6px]">
                    <div class="font-bold text-[1.1rem] flex items-center gap-2"><i class="fa-solid fa-check text-success"></i> Oil Changed</div>
                </div>
                <div class="font-bold text-text-primary text-[1.1rem]">₹500</div>
            </div>
            
            <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] no-underline text-text-primary mb-1">
                <div class="flex flex-col gap-[6px]">
                    <div class="font-bold text-[1.1rem] flex items-center gap-2"><i class="fa-solid fa-check text-success"></i> Brake Pads</div>
                </div>
                <div class="font-bold text-text-primary text-[1.1rem]">₹2400</div>
            </div>
            
            <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_2px_5px_rgba(0,0,0,0.02)] no-underline text-text-primary mb-1">
                <div class="flex flex-col gap-[6px]">
                    <div class="font-bold text-[1.1rem] flex items-center gap-2"><i class="fa-solid fa-check text-success"></i> AC Cleaning</div>
                </div>
                <div class="font-bold text-text-primary text-[1.1rem]">₹800</div>
            </div>

            <button class="flex items-center justify-center gap-3 w-full p-3 rounded-2xl text-[1.1rem] font-semibold cursor-pointer no-underline transition-transform duration-100 active:scale-[0.98] bg-transparent border-2 border-dashed border-primary text-primary">+ Add Work</button>

            <div class="h-[1px] bg-slate-300 mb-4 mt-5"></div>

            <div class="flex justify-between items-center py-[10px]">
                <div class="text-[1.2rem] font-bold">Total</div>
                <div class="text-[1.8rem] font-bold text-primary">₹3700</div>
            </div>

            <a href="invoice.html" class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-primary text-white shadow-[0_10px_15px_-3px_rgba(37,99,235,0.3)] mt-5">Generate Final Bill</a>
        </main>
    </div>
</body>
</html>
