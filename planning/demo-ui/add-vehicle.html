<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Vehicle</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb',
            'primary-hover': '#1d4ed8',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
            'bg-color': '#f1f5f9',
            'card-bg': '#ffffff',
            'text-primary': '#0f172a',
            'text-secondary': '#64748b',
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-200 flex justify-center min-h-screen font-sans text-text-primary">
  <div
    class="w-full max-w-[414px] h-screen overflow-y-auto flex flex-col relative shadow-[0_0_20px_rgba(0,0,0,0.1)] bg-slate-100">
    <header
      class="flex justify-between items-center p-5 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] sticky top-0 z-10">
      <div class="text-[1.2rem] font-semibold flex items-center gap-4">
        <a href="index.html" class="text-text-primary no-underline"><i class="fa-solid fa-arrow-left"></i></a>
        <span>New Vehicle</span>
      </div>
    </header>

    <main class="p-5 flex-1 flex flex-col gap-4 pb-[100px]">
      <div
        class="h-[140px] bg-slate-200 rounded-2xl flex flex-col justify-center items-center border-2 border-dashed border-slate-400 text-text-secondary font-semibold gap-2.5 cursor-pointer">
        <i class="fa-solid fa-camera text-[2rem] text-primary"></i>
        <span>Capture / Upload</span>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[0.95rem] font-semibold text-text-secondary">Vehicle Number</label>
        <input type="text" placeholder="e.g. OD 02 AB 1234"
          class="p-4 rounded-xl border border-slate-300 text-base w-full bg-white outline-none focus:border-primary">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[0.95rem] font-semibold text-text-secondary">Customer Name</label>
        <input type="text" placeholder="Customer Name"
          class="p-4 rounded-xl border border-slate-300 text-base w-full bg-white outline-none focus:border-primary">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[0.95rem] font-semibold text-text-secondary">Phone</label>
        <input type="tel" placeholder="Phone Number"
          class="p-4 rounded-xl border border-slate-300 text-base w-full bg-white outline-none focus:border-primary">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[0.95rem] font-semibold text-text-secondary">Vehicle</label>
        <input type="text" placeholder="Brand / Model (e.g. Honda City)"
          class="p-4 rounded-xl border border-slate-300 text-base w-full bg-white outline-none focus:border-primary">
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[0.95rem] font-semibold text-text-secondary">Complaint</label>
        <textarea rows="4" placeholder="Describe the issues..."
          class="p-4 rounded-xl border border-slate-300 text-base w-full bg-white outline-none focus:border-primary"></textarea>
      </div>

      <a href="vehicle-details.html"
        class="flex items-center justify-center gap-3 w-full p-[18px] rounded-2xl text-[1.1rem] font-semibold cursor-pointer border-none no-underline transition-transform duration-100 active:scale-[0.98] bg-primary text-white shadow-[0_10px_15px_-3px_rgba(37,99,235,0.3)] mt-2.5">
        Save Vehicle
      </a>
    </main>
  </div>
</body>

</html>
